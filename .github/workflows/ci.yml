name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        vscode: ['1.96.2', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select VS Code version
        shell: bash
        run: echo "VSCODE_TEST_VERSION=${{ matrix.vscode }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - name: Test VS Code editor tabs on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Test VS Code editor tabs on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - run: npm run package
